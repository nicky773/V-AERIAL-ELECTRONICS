services:
  - type: web
    name: aerial-electronics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn aerial_project.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerial-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: v-aerial-electronics.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://v-aerial-electronics.onrender.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: MTN_CALLBACK_SECRET
        sync: false

databases:
  - name: aerial-db
    plan: free
