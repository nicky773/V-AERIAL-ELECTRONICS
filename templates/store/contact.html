{% extends 'base.html' %}{% block title %}Contact us{% endblock %}{% block content %}<div class="container py-5"><div class="row g-5"><div class="col-lg-5"><h1 class="fw-bold">Contact AERIAL</h1><p class="text-muted">Send us a message and our team will respond.</p><p><i class="bi bi-telephone text-primary"></i> <strong>+250 788 945 021</strong></p><p><i class="bi bi-geo-alt text-primary"></i> <strong>Kigali, Rwanda</strong></p></div><div class="col-lg-7"><form method="post" class="card border-0 shadow-sm p-4">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div><div class="col-12"><label class="form-label">Subject</label><input name="subject" class="form-control" required></div><div class="col-12"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="5" required></textarea></div><div class="col-12"><button class="btn btn-primary px-4">Send message</button></div></div></form></div></div></div>{% endblock %}
