{% extends 'dashboard/base.html' %}{% block content %}<h2>Messages</h2>{% for message in messages %}<div class="card stat-card p-3 mt-3"><div class="d-flex justify-content-between"><h5>{{ message.subject }}</h5><small>{{ message.created_at|date:'d M Y' }}</small></div><p class="mb-1">{{ message.name }} · {{ message.email }}</p><p>{{ message.message }}</p><form method="post">{% csrf_token %}<input type="hidden" name="message_id" value="{{ message.id }}"><textarea name="reply" class="form-control mb-2" placeholder="Reply">{{ message.reply }}</textarea><button class="btn btn-primary">Save reply</button></form></div>{% endfor %}{% endblock %}
