{% extends 'base.html' %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<main class="auth-shell container py-5">
  <div class="auth-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <span class="auth-eyebrow">ACCOUNT RECOVERY</span>
      <h1 class="h3 fw-bold mt-2">Choose a new password</h1>
      <p class="text-muted">Use a strong password you haven’t used here before.</p>
      <form method="post" class="auth-form mt-4" data-loading-form>
        {% csrf_token %}
        <label class="form-label" for="newPassword">New password</label>
        <input id="newPassword" type="password" name="password" class="form-control mb-3" autocomplete="new-password" required>
        <label class="form-label" for="newPasswordConfirm">Confirm new password</label>
        <input id="newPasswordConfirm" type="password" name="password_confirm" class="form-control mb-4" autocomplete="new-password" required>
        <button class="btn btn-primary w-100 auth-submit" type="submit"><span class="button-label">Save new password</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
