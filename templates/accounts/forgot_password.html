{% extends 'base.html' %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<main class="auth-shell container py-5">
  <div class="auth-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <span class="auth-eyebrow">ACCOUNT RECOVERY</span>
      <h1 class="h3 fw-bold mt-2">Forgot your password?</h1>
      <p class="text-muted">Enter your account email. If it matches an active account, we’ll send a reset code.</p>
      <form method="post" class="auth-form mt-4" data-loading-form>
        {% csrf_token %}
        <label class="form-label" for="resetEmail">Email address</label>
        <input id="resetEmail" type="email" name="email" class="form-control mb-4" autocomplete="email" required>
        <button class="btn btn-primary w-100 auth-submit" type="submit"><span class="button-label">Send reset code</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
      </form>
      <p class="text-center mt-4 mb-0"><a href="{% url 'login' %}">Back to sign in</a></p>
    </div>
  </div>
</main>
{% endblock %}
