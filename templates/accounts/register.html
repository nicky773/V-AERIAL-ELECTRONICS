{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<main class="auth-shell container py-5">
  <div class="auth-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <span class="auth-eyebrow">AERIAL ELECTRONICS</span>
      <h1 class="h3 fw-bold mt-2">Create your account</h1>
      <p class="text-muted">We’ll email you a six-digit code to verify your address.</p>
      <form method="post" class="auth-form mt-4" data-loading-form>
        {% csrf_token %}
        <label class="form-label" for="fullName">Full name</label>
        <input id="fullName" name="name" class="form-control mb-3" autocomplete="name" maxlength="150" required>
        <label class="form-label" for="registerEmail">Email address</label>
        <input id="registerEmail" type="email" name="email" class="form-control mb-3" autocomplete="email" required>
        <label class="form-label" for="registerPhone">Phone number <span class="text-muted">(optional)</span></label>
        <input id="registerPhone" type="tel" name="phone" class="form-control mb-3" placeholder="0788 000 000" autocomplete="tel">
        <label class="form-label" for="registerPassword">Password</label>
        <input id="registerPassword" type="password" name="password" class="form-control mb-3" autocomplete="new-password" required>
        <label class="form-label" for="registerPasswordConfirm">Confirm password</label>
        <input id="registerPasswordConfirm" type="password" name="password_confirm" class="form-control mb-4" autocomplete="new-password" required>
        <button class="btn btn-primary w-100 auth-submit" type="submit"><span class="button-label">Create account and send code</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
      </form>
      <p class="text-center mt-4 mb-0">Already registered? <a href="{% url 'login' %}">Sign in</a></p>
    </div>
  </div>
</main>
{% endblock %}
