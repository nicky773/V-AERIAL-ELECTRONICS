{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<main class="login-split">
  <div class="login-split-inner">
    <section class="login-hero" aria-hidden="true"></section>

    <section class="login-panel card border-0 shadow-sm" aria-labelledby="loginTitle">
      <div class="login-panel-inner">
        <div class="auth-icon" aria-hidden="true"><i class="bi bi-person"></i></div>
        <h1 class="h4 fw-bold text-center mb-1" id="loginTitle">Login to Your Account</h1>
        <p class="text-center text-muted small mb-4">We’ll email a one-time code to finish signing in.</p>

        <form method="post" class="auth-form" data-loading-form>
          {% csrf_token %}
          <label class="form-label" for="loginIdentifier">Email or phone number</label>
          <input id="loginIdentifier" type="text" name="identifier" class="form-control mb-3" placeholder="Enter your email or phone" autocomplete="username" required>

          <div class="d-flex justify-content-between align-items-end">
            <label class="form-label" for="loginPassword">Password</label>
            <a class="small" href="{% url 'forgot_password' %}">Forgot password?</a>
          </div>
          <div class="input-group mb-3">
            <input id="loginPassword" type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye"></i></button>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" value="1">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>

          <button class="btn btn-dark w-100 auth-submit" type="submit"><span class="button-label">Login</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
        </form>

        <p class="text-center small mt-4 mb-0">Don’t have an account? <a href="{% url 'register' %}">Register now</a></p>
      </div>
    </section>
  </div>
</main>
<script>
(() => {
  const password = document.getElementById('loginPassword');
  const toggle = document.getElementById('togglePassword');
  toggle?.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    toggle.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
  });
})();
</script>
{% endblock %}
