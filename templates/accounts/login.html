{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<main class="auth-shell container py-5">
  <div class="auth-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <span class="auth-eyebrow">WELCOME BACK</span>
      <h1 class="h3 fw-bold mt-2">Sign in</h1>
      <p class="text-muted">Enter your details. We’ll send a one-time code to your account email.</p>
      <form method="post" class="auth-form mt-4" data-loading-form>
        {% csrf_token %}
        <label class="form-label" for="loginIdentifier">Email or phone number</label>
        <input id="loginIdentifier" type="text" name="identifier" class="form-control mb-3" placeholder="Email or 0788 000 000" autocomplete="username" required>
        <label class="form-label" for="loginPassword">Password</label>
        <input id="loginPassword" type="password" name="password" class="form-control mb-2" autocomplete="current-password" required>
        <div class="text-end mb-4"><a href="{% url 'forgot_password' %}">Forgot password?</a></div>
        <button class="btn btn-primary w-100 auth-submit" type="submit"><span class="button-label">Continue with email code</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
      </form>
      <p class="text-center mt-4 mb-0">New customer? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
  </div>
</main>
{% endblock %}
